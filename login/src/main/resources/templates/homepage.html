<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Chat App - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .chat-card {
            transition: 0.2s;
            cursor: pointer;
        }
        .chat-card:hover {
            background-color: #f1f1f1;
            transform: scale(1.02);
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">Chat App</a>
        <div class="d-flex">
            <a th:href="@{/logout}" class="btn btn-outline-light">Logout</a>
        </div>
    </div>
</nav>

<!-- Main content -->
<div class="container mt-4">
    <h4 class="mb-3">Contacts</h4>

    <!-- Search -->
    <div class="input-group mb-3">
        <input type="text" id="searchInput" class="form-control" placeholder="Search contacts...">
        <button class="btn btn-outline-secondary" type="button">Search</button>
    </div>

    <!-- Contacts list -->
    <div class="list-group">
        <a th:href="@{/chat/john}" class="list-group-item list-group-item-action d-flex align-items-center chat-card">
            <img src="https://randomuser.me/api/portraits/men/10.jpg" class="avatar me-3">
            <div>
                <h6 class="mb-0">Satvik</h6>
                <small class="text-muted">Last message preview...</small>
            </div>
        </a>
        <a th:href="@{/chat/jane}" class="list-group-item list-group-item-action d-flex align-items-center chat-card">
            <img src="https://randomuser.me/api/portraits/women/20.jpg" class="avatar me-3">
            <div>
                <h6 class="mb-0">Dishika</h6>
                <small class="text-muted">Hey, how’s it going?</small>
            </div>
        </a>
        <a th:href="@{/chat/alex}" class="list-group-item list-group-item-action d-flex align-items-center chat-card">
            <img src="https://randomuser.me/api/portraits/men/30.jpg" class="avatar me-3">
            <div>
                <h6 class="mb-0">Shivansh</h6>
                <small class="text-muted">Yo! Let’s catch up.</small>
            </div>
        </a>
    </div>
</div>

<script>
    // Simple search filter
    document.getElementById('searchInput').addEventListener('keyup', function() {
        let filter = this.value.toLowerCase();
        let items = document.querySelectorAll('.list-group-item');
        items.forEach(item => {
            let text = item.textContent.toLowerCase();
            item.style.display = text.includes(filter) ? "" : "none";
        });
    });
</script>

</body>
</html>
